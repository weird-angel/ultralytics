# YOLO11 object detection model with Depthwise Oriented 1D (DWOConv1d) backbone blocks.
#
# This model implements the full learnable-angle depthwise oriented 1D convolution from:
#   "Convolutional Networks with Oriented 1D Kernels", Kirchmeyer & Deng, ICCV 2023.
#   https://arxiv.org/abs/2309.15812
#
# The three folders in https://github.com/princeton-vl/Oriented1D/tree/master/models all implement
# the same underlying DepthwiseOrientedConv1d operation using custom CUDA kernels:
#
#   dwoconv1d             — optimised CUDA kernel (main implementation)
#   dwoconv1d_reference   — simpler CUDA kernel for correctness testing
#   dwoconv1d_specialized — pre-compiled CUDA for fixed spatial dimensions (fastest at known size)
#
# C2fDWO blocks use DWOConv1d — a pure-PyTorch equivalent that requires no custom CUDA extensions.
# Each channel has its own learnable rotation angle theta, providing strictly more representational
# power than the fixed horizontal+vertical decomposition used in C2f1D / OAConv.
#
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs:  https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11-dwoconv1dn.yaml' will call yolo11-dwoconv1d.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11-DWOConv1d backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C2fDWO, [256, False]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C2fDWO, [512, False]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C2fDWO, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C2fDWO, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11-DWOConv1d head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C2fDWO, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C2fDWO, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C2fDWO, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C2fDWO, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
