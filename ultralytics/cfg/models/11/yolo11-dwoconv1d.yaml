# YOLO11 object detection model with oriented 1D convolution (DWOConv1d) backbone blocks.
#
# The oriented 1D convolution technique is borrowed from the Oriented1D paper
# (Kirchmeyer & Deng, ICCV 2023, https://arxiv.org/abs/2309.15812):
#   - Learnable per-channel rotation angle theta, trained end-to-end via bilinear sampling.
#   - Channel angles initialised with make_cyclic_angles(), cycling across N=8 evenly-spaced
#     directions in [0, π) (channel_cycle_offset convention from the paper).
#   - Consecutive blocks alternate orientation by 90° (layer_wise_rotation_offset, enable_layer_cycle).
#
# All other design choices follow YOLO conventions — NOT ConvNeXt:
#   - BatchNorm2d + SiLU after every convolution (not LayerNorm / GELU).
#   - YOLO bottleneck: Conv(1×1, BN+SiLU) → DWOConv1d(BN+SiLU) → Conv(1×1, BN) + shortcut.
#   - No ConvNeXt features: no 4× FFN expansion, no layer scale gamma, no LayerNorm.
#   - C2f CSP structure and YOLO head/neck unchanged.
#
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs:  https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11-dwoconv1dn.yaml' will call yolo11-dwoconv1d.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11-DWOConv1d backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C2fDWO, [256, False]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C2fDWO, [512, False]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C2fDWO, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C2fDWO, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11-DWOConv1d head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C2fDWO, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C2fDWO, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C2fDWO, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C2fDWO, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
